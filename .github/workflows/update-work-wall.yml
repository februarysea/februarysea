name: Update Work Wall

on:
  schedule:
    - cron: "0 16 * * *"   # 每天北京时间 00:00 运行（UTC 16:00）
  workflow_dispatch: {}     # 允许手动触发

# 允许使用 GITHUB_TOKEN 写入仓库（提交 SVG）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate SVG
        run: python generate_wall.py

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add work-stats.svg
            git commit -m "chore: update work wall"
            # 防止偶发非快进失败，先拉再推
            git pull --rebase || true
            git push
          else
            echo "No changes."
          fi
